name: SaveGuard native safety tests
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/native-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test export
        run: |
          cc -Wall -Wextra -Werror src/export.c tests/export_test.c -o export_test
          ./export_test
      - name: Compile discovery
        run: cc -Wall -Wextra -Werror src/discovery.c -o discovery
      - name: Install native development dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libmbedtls-dev libsqlite3-dev inkscape python3-pil fonts-dejavu-core
      - name: Generate PlayStation button icons
        run: python3 assets/build_ps4_button_icons.py assets/ps4-gamepad-icons.svg src/button_icons_generated.h
      - name: Generate smooth dashboard font
        run: python3 assets/build_ps4_font.py /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf src/ui_font_generated.h
      - name: Compile and link full dashboard
        run: |
          cc -std=gnu11 -Wall -Wextra $(sdl2-config --cflags) src/{ps4_main,export,snapshot,catalog,history,integrity,verify,restore,batch,schedule,settings,trash,pin,pin_guard,pin_store,usb_guard,save_db}.c $(sdl2-config --libs) -lmbedcrypto -lsqlite3 -o saveguard-native
      - name: Test PIN authorization
        run: |
          cc -Wall -Wextra -Werror src/pin.c src/pin_guard.c tests/pin_test.c -lmbedcrypto -o pin_test
          ./pin_test
      - name: Test save database inventory
        run: |
          cc -Wall -Wextra -Werror src/save_db.c tests/save_db_test.c -lsqlite3 -o save_db_test
          ./save_db_test
